</section><noscript><section class="ve-noscript-reading" aria-label="企业落地常见问题"><section data-reading-topic="fde"><h2>IT 部门能不能自己做？</h2><section><h3>会用工具，为什么还不够？</h3><p>红线表示自建 FDE 团队的累计成本：开始时承担组建投入，之后持续支付人员费用。即使某个月没有新的高难需求，薪资和团队维护也不会自动停止，所以这条线起点较高，并随时间继续向上。</p><p>会搭知识库、调用模型、编排工作流，只是起点。真正耗时的，是调研、分类、清洗、标注、评测和后续运营。内部 IT 团队如果缺少这部分经验和持续投入，仅把工具部署好，往往接不住完整的落地工作。</p><p>答案是否稳定、错误能否修正、知识有没有人维护，决定了员工能否持续使用。工具会进步，把企业知识、流程和规则整理清楚的工作仍然需要有人做。</p></section><section><h3>知识治理，具体要理清什么？</h3><p>- 知识怎么组织：分哪些类、建哪些库、各放什么文档；多个版本以哪个为准。</p><p>- 部门边界怎么划分：谁维护哪些内容，在哪里维护。</p><p>- 文档如何准入：格式和质量有什么要求，不合要求的内容怎样修改。</p><p>- 回答如何纠错：哪些问题能直接回答，哪些必须追问；答案错了由谁改，改后怎样验证。</p></section><section><h3>自建成本，为什么会持续增加？</h3><p>高难问题可能偶尔才出现，团队的薪资、培养和维护却需要持续承担。直接招聘外部人才，要承担长期用人成本；从内部培养，也要投入学习、探索和管理。人才供需、初期适配和后续迭代，还会影响费用增长的速度，因此红线并不只是固定斜率的直线。</p><p>一支团队只服务一家企业，同类经验和技术投入很难充分摊薄。我们服务多个客户，可以复用技术、积累相似问题的处理经验，把解决高难问题的能力成本分摊到多个项目里。</p><p>红线与亮蓝线代表自建团队和外部交付两种投入方式，应分别比较，不能相加。同样也不能仅凭预算高低，判断两种方式一定能交付相同效果。</p></section><section><h3>持续学习，也需要有人组织</h3><p>AI 变化很快，需要持续接触同行、项目和新方法，判断哪些能够用于业务。外部团队接触不同客户和行业，可以把这些经验带进来，参与新路径的探索和试错。</p><p>内部自建同样需要管理投入：谁带着团队学，如何安排探索，怎样判断学到的东西能否解决问题。只安排一个“研究 AI”的任务还不够，时间、激励和评估都要落实。</p></section></section><section data-reading-topic="return"><h2>回报到底在哪里？</h2><section><h3>先验收哪类回报？</h3><p>金线表示项目被实际使用后，逐月积累的产能价值。刚开始需要磨合和采用，增长较慢；员工用得稳定后，每个月改善的工作能力持续累加，曲线才逐渐向上。</p><p>只看短期交付，已经付出的成本可能还没有被产能改善覆盖。把观察时间拉长，才能同时看到后续投入和价值积累；金线能否超过蓝线或红线，取决于实际采用、维护和复用效果。</p><p>先看具体工作有没有改善：报告生成时间是否缩短，客服响应是否更快，合同初筛覆盖了多少风险点，新员工培训周期是否缩短，销售回复的质量是否提高。</p><p>这些过程指标更容易观察和归因。先记录原来的做法，再比较使用后的时间、质量和风险覆盖，确认一个环节有效，再谈扩大使用。</p></section><section><h3>为什么先不承诺增收和利润？</h3><p>收入、利润和成交率还受市场、产品、品牌、销售组织与客户资源影响。AI 可以改善其中的环节，不能单凭一个工具就承诺最终经营结果。减员也涉及岗位、职责和管理决策，不会因为节省工时就自动发生。</p><p>所以早期先验证流程是否跑通、答案质量是否达标、员工是否愿意使用。图中的产能价值是工作改善的示意折算，不等于现金利润；评估项目回报，还需要扣除完整投入。</p></section><section><h3>省下的时间，怎样再变成价值？</h3><p>我们希望 AI 帮员工完成繁重、重复的工作，让人有时间学习和改进工作。省下的时间可以用于企业 AI 培训，再拿真实任务练习，把学到的方法用回日常工作。</p><p>这样形成“减少重复劳动—学习 AI—改进任务—再次验证”的循环。项目的目标是帮助员工把工作做好，让经验不断积累；节省工时并不意味着岗位会自动消失。</p><p>更长期的价值来自知识治理：已经理清的规则、标准、历史案例，以及代码、图纸、模型和文档之间的关系，可以继续供下一代模型使用。模型能力提高后，同一批治理成果有机会支持更多任务，前期投入的价值因而不只限于一次交付。</p><p>图中把员工采用、模型能力改善和知识复用一起纳入推演。长期价值仍需要员工持续使用、知识持续维护，并用真实任务检验；换一个更强的模型，不会自动把没有整理好的业务变成收益。</p></section><section><h3>员工为什么愿意用？</h3><p>试用初期难免遇到问题，员工也需要花时间学习。要给试用和反馈留出时间，并用适当激励鼓励大家提出需求、指出错误、一起改进。</p><p>使用中的问题有人回应，改进能在工作中看见，培训才更容易转化为持续使用。</p></section></section><section data-reading-topic="investment"><h2>产品会贬值吗？为什么现在做？</h2><section><h3>什么会贬值，什么能留下？</h3><p>先分清两条蓝线。细蓝线比较不同时间开始时的一次预估报价；选定入场点后，亮蓝线从这笔报价出发，再逐月累加运维费用。选择入场时间，是换一个时点比较价格，不是每到一个时点都重新支付一次项目费。</p><p>这笔投入是否会贬值，要看买到的是什么。通用聊天界面、简单提示词，可能随着模型升级和技术普及变得便宜，甚至失去独立价值。</p><p>我们做的是梳理企业自己的规则、标准和历史案例，建立代码、二维图纸、三维模型、文档之间的关系。这些工作依赖业务沟通和数据对应，价值不只取决于今天用了哪一个模型。</p></section><section><h3>模型升级后，已有投入还能用吗？</h3><p>模型能力和产品形态都在变化，今天合适的方案，之后可能需要调整。提前理清的数据、规则和关系，可以供新模型继续使用；能带来多少新增价值，还要回到业务中验证。</p><p>因此，交付一个系统只是开始。企业也需要逐步建立理解 AI、发现需求、调整方案的能力，让知识治理随业务和模型一起迭代。</p></section><section><h3>技术便宜了，项目就一定便宜吗？</h3><p>技术成本只是项目投入的一部分。当前报价示意包含技术基础、专业交付和市场供需溢价：技术项可能波动或下降，而专业人才与交付能力紧缺时，供需溢价可能上升，抵消技术降价。业务调研、知识整理和评测也需要人来完成。</p><p>选定入场点后，亮蓝线按这次报价加上后续运维累计，不会跟着未来的市场报价重新计费。图中尚未把企业内部协作、算力、培训等所有可能费用逐项展开，实际投入要按项目范围核算。</p></section><section><h3>为什么不一直等？</h3><p>金线的高度表示累计产能价值，斜率表示单位时间新增的价值。刚开始时，员工使用、流程磨合和知识复用都不充分，单位时间创造的价值还不够高；这些能力逐渐积累，金线才有机会变得更陡。</p><p>一直等，推迟的不只是开始累计的时间，也包括把单位时间价值做高的过程。即使以后买到更成熟、更便宜的工具，企业仍要经历学习、试用和改进，不能一开始就获得成熟使用后的产能。</p><p>图上的横轴是入场时点与随后经过的时间。移动入场点，会重新计算报价、团队费用和采用条件；比较到同一个未来观察点时，早开始多了实践与复用的时间，晚开始可能用上更成熟的工具，却少了一段积累期。因此曲线会重新变化，不是简单平移。</p><p>所以，要同时看还能积累多久，以及每单位时间能创造多高的价值。是否值得现在做，仍要比较实际改善、等待成本与试错成本：先选一个具体环节，验证有效，再扩大投入。</p></section></section><section data-reading-topic="safety"><h2>谁来保障可靠和安全？</h2><section><h3>先让错误被看见，再提升效率</h3><p>安全事故直接作用在原来的金线上：在事故节点扣除损失，让曲线急剧下弯，甚至跌破 X 轴。负值表示损失超过此前积累的产能价值，提醒我们把安全与总投入、回报一起考虑。它不表示事故发生概率，也不是已经扣除全部项目支出的净利润。</p><p>事故之后，图中仍按原有产能假设继续积累；实际能否恢复、恢复多快，需要看事故和处置情况。不能把这段后续曲线当成恢复承诺。</p><p>提效的收益，可能被一次严重错误抵消。不能为了提效放松质量要求：质检可以先由人工与 AI 共同检查；数据处理先用 AI 发现异常；报告场景先做素材校验。</p><p>先把容易发现、可以复核的问题跑通，建立信任，再逐步扩大 AI 承担的工作。</p></section><section><h3>出了错，由谁处理？</h3><p>错误怎样被发现，由谁负责，怎样快速修正，哪些输出需要人工复核，都要在项目中明确。不能把责任笼统归给“AI 出错了”。</p><p>服务双方需要结合具体场景和服务范围，约定知识由谁维护、异常由谁接手、高风险输出由谁复核，以及修正后由谁验收。把这些安排落实，业务负责人才能知道问题出现后怎么处理。</p></section><section><h3>公有 API 和私有化，怎么选？</h3><p>调用外部模型时，问题、检索片段或上下文会发送到服务端参与推理。数据是否保留、是否用于训练，要看服务商协议和具体配置。</p><p>私有化适合高敏感、核心业务等场景，但部署在内网并不能替代权限管理。选择部署方式时，需要一起考虑数据分级、传输加密、存储策略、日志留存、访问权限和脱敏机制。</p></section><section><h3>按数据和场景分层使用</h3><p>公开信息、行业资料、营销素材和通用办公文本，可以选择符合企业要求的 API；内部制度、流程文件和业务知识，需要结合权限、脱敏和日志机制使用；合同、财务、经营分析和客户隐私，则需要更严格的部署和访问控制。</p><p>把谁能使用、在哪调用、能否追踪、谁来复核说清楚，再逐层推进。低敏场景先用起来，高敏场景严控边界，核心场景考虑私有化或专属部署，避免一开始就让所有场景承担同样重的投入。</p></section></section></section></noscript></div></main></div></div><script defer src="/home-assets/feedback-20260926-v1/site-feedback.js"></script></body></html>
